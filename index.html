<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Calculator</title>
<meta name="description" content="See how sample size, effect size and power trade off in a two-group study, how group size narrows the spread of sample averages, and draw samples of your own.">
<!-- Instructor notes (method, hidden link options, deployment) are in README.md alongside this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #ffffff;
    --panel: #dbe3e5;
    --line-on-panel: #bfcbce;
    --field: #ffffff;
    --ink: #17191a;
    --ink-2: #454c4f;
    --muted: #687174;
    --rule: #dde3e5;
    --grid: #eceff0;
    --control: #2a78d6;
    --treatment: #eb6834;
    --control-ink: #1d5fae;
    --plot-bg: #f5f7f7;
    --treatment-ink: #bf4517;
    --solved-bg: #17191a;
    --solved-ink: #ffffff;
    --note-bg: #fbf3e8;
    --note-ink: #6e3d0b;
    --error: #b42318;
    --serif: "Source Serif 4", "Source Serif Pro", Charter, "Iowan Old Style", Georgia, serif;
    --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #131516; --panel: #1e2628; --line-on-panel: #39464a; --field: #111415;
      --ink: #f1f3f3; --ink-2: #c3cacc; --muted: #929b9e; --rule: #2a3133; --grid: #222a2c;
      --control: #3987e5; --treatment: #d95926; --control-ink: #7db3f2; --treatment-ink: #f39a70; --plot-bg: #191e20; --solved-bg: #f1f3f3; --solved-ink: #131516;
      --note-bg: #2e2316; --note-ink: #f3c98f; --error: #ff8a80;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #131516; --panel: #1e2628; --line-on-panel: #39464a; --field: #111415;
    --ink: #f1f3f3; --ink-2: #c3cacc; --muted: #929b9e; --rule: #2a3133; --grid: #222a2c;
    --control: #3987e5; --treatment: #d95926; --control-ink: #7db3f2; --treatment-ink: #f39a70; --plot-bg: #191e20; --solved-bg: #f1f3f3; --solved-ink: #131516;
    --note-bg: #2e2316; --note-ink: #f3c98f; --error: #ff8a80;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  .layout { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); min-height: 100vh; }

  /* ---------- Left panel: the inputs ---------- */
  .controls { background: var(--panel); padding: 40px 32px 48px; }
  .controls-inner { position: sticky; top: 24px; }
  .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.12; margin: 0 0 14px; letter-spacing: -.01em; }
  .lede { font-family: var(--serif); font-size: 18px; line-height: 1.4; margin: 0 0 22px; color: var(--ink-2); }
  .short-rule { width: 56px; height: 1px; background: var(--ink-2); opacity: .5; margin: 0 0 22px; border: 0; }

  .block-label { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 8%, transparent); margin-bottom: 22px; }
  .seg button, .pill-row button {
    font: inherit; font-size: 14px; border: 0; cursor: pointer; border-radius: 7px; padding: 8px 6px;
    background: transparent; color: var(--ink-2); line-height: 1.2;
  }
  .seg button[aria-checked="true"] { background: var(--solved-bg); color: var(--solved-ink); font-weight: 600; }
  .seg button:not([aria-checked="true"]):hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--control); outline-offset: 2px; }

  .group-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: block; margin-bottom: 16px; }
  .field-label { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .field-sub { display: block; font-size: 12.5px; color: var(--muted); margin: -3px 0 5px; font-weight: 400; }
  .calc-tag { display: none; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-2); }
  .field-input { position: relative; display: flex; align-items: center; }
  .field input {
    width: 100%; font: inherit; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink);
    background: var(--field); border: 1px solid var(--line-on-panel); border-radius: 8px; padding: 9px 12px; min-height: 44px;
  }
  .field input.with-unit { padding-right: 58px; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .unit { position: absolute; right: 12px; font-size: 13px; color: var(--muted); pointer-events: none; }
  .field.is-solved .calc-tag { display: inline; }
  .field.is-solved input { background: var(--solved-bg); color: var(--solved-ink); border-color: var(--solved-bg); font-weight: 600; cursor: default; }
  .field.is-solved input::placeholder { color: var(--solved-ink); opacity: .75; }
  .field.is-solved .unit { color: color-mix(in srgb, var(--solved-ink) 70%, transparent); }
  .field.has-error input { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); }
  .field-error { display: block; font-size: 12.5px; color: var(--error); margin-top: 4px; }
  .field-error:empty { display: none; }

  .grow { margin: -4px 0 18px; }
  .grow[hidden] { display: none; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill-row button { border: 1px solid var(--line-on-panel); background: var(--field); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .pill-row button[aria-checked="true"] { background: var(--solved-bg); border-color: var(--solved-bg); color: var(--solved-ink); }
  .settings { margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line-on-panel); }
  .settings .field { margin-bottom: 0; max-width: 170px; }

  /* ---------- Right side: answer + graphs ---------- */
  .results { padding: 40px clamp(16px, 4vw, 56px) 56px; max-width: 1000px; width: 100%; }
  .answer { padding-bottom: 26px; border-bottom: 1px solid var(--rule); }
  .answer-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .answer-kicker { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
  .link-btn { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .link-btn:hover { color: var(--ink); border-color: var(--ink-2); }
  .answer-value { font-family: var(--serif); font-size: clamp(46px, 7vw, 70px); line-height: 1; margin: 12px 0 14px; font-variant-numeric: lining-nums; }
  .answer-value small { font-size: .36em; color: var(--ink-2); margin-left: .25em; }
  .answer-text { font-family: var(--serif); font-size: 20px; line-height: 1.45; margin: 0; max-width: 44em; }
  .answer-text b { font-weight: 400; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--treatment) 26%, transparent) 62%); }
  .callout { margin: 16px 0 0; padding: 12px 14px; border-radius: 8px; background: var(--note-bg); color: var(--note-ink); font-size: 15px; max-width: 44em; }
  .callout:empty { display: none; }

  .figure { padding-top: 26px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 13.5px; color: var(--ink-2); margin: 0 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
  .chart { position: relative; width: 100%; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; background: var(--page); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 8px; padding: 5px 9px; font-size: 13px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.12);
    white-space: nowrap; opacity: 0; transition: opacity .08s; z-index: 2; font-variant-numeric: tabular-nums;
  }
  .tip.on { opacity: 1; }
  svg text { font-family: var(--sans); }
  .axis text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis-title { fill: var(--ink-2); font-size: 12.5px; }
  .panel-title { fill: var(--ink); font-family: var(--serif); font-size: 19px; }
  .curve-label { font-size: 13px; font-weight: 700; paint-order: stroke; stroke: var(--plot-bg); stroke-width: 4px; stroke-linejoin: round; }
  .lane-label { font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: var(--plot-bg); stroke-width: 4px; stroke-linejoin: round; }
  .mean-label { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--plot-bg); stroke-width: 4px; stroke-linejoin: round; }
  .diff-readout { fill: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sample-btn {
    position: absolute; z-index: 1; min-width: 104px; height: 34px; padding: 0 18px; border: 0; border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; background: var(--solved-bg); color: var(--solved-ink);
  }
  .sample-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--solved-bg) 85%, var(--control)); }
  .sample-btn:disabled { opacity: .35; cursor: not-allowed; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .controls { padding: 28px 16px 24px; }
    .controls-inner { position: static; }
    h1 { font-size: 31px; }
    .results { padding: 28px 16px 48px; }
    .answer-text { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="controls">
    <div class="controls-inner">
      <p class="eyebrow">Statistics &middot; Planning a study</p>
      <h1>Power, sample size &amp; effect size</h1>
      <p class="lede">Fix any two of the three, and the calculator finds the one you leave out.</p>
      <hr class="short-rule">

      <span class="block-label" id="solveLabel">Solve for</span>
      <div class="seg" role="radiogroup" aria-labelledby="solveLabel" id="solveSeg">
        <button type="button" role="radio" data-solve="n">Sample size</button>
        <button type="button" role="radio" data-solve="diff">Difference</button>
        <button type="button" role="radio" data-solve="power">Power</button>
      </div>

      <span class="block-label">Group sizes</span>
      <div class="group-pair">
        <label class="field" id="f-n1">
          <span class="field-label">Control <span class="calc-tag">solved</span></span>
          <span class="field-input"><input id="n1" class="with-unit" type="number" inputmode="numeric" min="2" step="1" value="20"><span class="unit">people</span></span>
          <span class="field-error" id="e-n1"></span>
        </label>
        <label class="field" id="f-n2">
          <span class="field-label">Treatment <span class="calc-tag">solved</span></span>
          <span class="field-input"><input id="n2" class="with-unit" type="number" inputmode="numeric" min="2" step="1" value="20"><span class="unit">people</span></span>
          <span class="field-error" id="e-n2"></span>
        </label>
      </div>
      <div class="grow" id="growBox">
        <span class="block-label" id="growLabel">Which group can grow?</span>
        <div class="pill-row" role="radiogroup" aria-labelledby="growLabel" id="growSeg">
          <button type="button" role="radio" data-grow="both" title="Both groups grow, kept equal in size">Both</button>
          <button type="button" role="radio" data-grow="control">Control only</button>
          <button type="button" role="radio" data-grow="treatment">Treatment only</button>
        </div>
      </div>

      <label class="field" id="f-mu">
        <span class="field-label">Control group average</span>
        <span class="field-sub">Average without the treatment, in your units</span>
        <span class="field-input"><input id="mu" type="number" inputmode="decimal" step="any" value="100"></span>
        <span class="field-error" id="e-mu"></span>
      </label>

      <label class="field" id="f-diff">
        <span class="field-label">Difference in means <span class="calc-tag">solved</span></span>
        <span class="field-sub">Treatment average minus control average, in your units</span>
        <span class="field-input"><input id="diff" type="number" inputmode="decimal" step="any" value="5"></span>
        <span class="field-error" id="e-diff"></span>
      </label>

      <label class="field" id="f-sd">
        <span class="field-label">Standard deviation</span>
        <span class="field-sub">How much individuals vary within each group</span>
        <span class="field-input"><input id="sd" type="number" inputmode="decimal" min="0" step="any" value="5"></span>
        <span class="field-error" id="e-sd"></span>
      </label>

      <label class="field" id="f-power">
        <span class="field-label"><span id="powerLabelText">Power you need</span> <span class="calc-tag">solved</span></span>
        <span class="field-sub">Chance the study detects the difference, if it&rsquo;s real</span>
        <span class="field-input"><input id="power" class="with-unit" type="number" inputmode="decimal" min="1" max="99.9" step="any" value="80"><span class="unit">%</span></span>
        <span class="field-error" id="e-power"></span>
      </label>

      <div class="settings">
        <label class="field" id="f-alpha">
          <span class="field-label">Significance level</span>
          <span class="field-sub">Usually 0.05</span>
          <span class="field-input"><input id="alpha" type="number" inputmode="decimal" min="0.0001" max="0.5" step="any" value="0.01"></span>
          <span class="field-error" id="e-alpha"></span>
        </label>
      </div>
    </div>
  </aside>

  <main class="results">
    <section class="answer" aria-live="polite">
      <div class="answer-top">
        <p class="answer-kicker" id="answerKicker">Power</p>
        <button type="button" class="link-btn" id="copyLink">Copy link</button>
      </div>
      <p class="answer-value" id="answerValue">&ndash;</p>
      <p class="answer-text" id="answerText"></p>
      <p class="callout" id="answerNote"></p>
    </section>

    <section class="figure">
      <div class="legend">
        <span><i class="sw" style="background:var(--control)"></i>Control group</span>
        <span><i class="sw" style="background:var(--treatment)"></i>Treatment group</span>
      </div>
      <div class="chart" id="chart"></div>
    </section>
  </main>
</div>

<script>
/* ===== Power engine: two-sample (pooled-variance) t-test =====
   Everything is computed exactly from the noncentral t distribution,
   integrated numerically over the chi distribution of the sample SD:
     T = (Z + delta) / S,   S = sqrt(V / nu),   V ~ chi-square(nu)
     P(T <= t) = E[ Phi(t*S - delta) ]
   No external libraries. */
const PowerEngine = (() => {
  const INV_SQRT_2PI = 1 / Math.sqrt(2 * Math.PI);

  // Standard normal CDF: Hart (1968) double-precision rational approximation, as given by West (2005).
  // Absolute error ~2e-16 everywhere; fast enough to evaluate millions of times per keystroke.
  function Phi(x) {
    const a = Math.abs(x);
    let c;
    if (a > 37) c = 0;
    else {
      const e = Math.exp(-a * a / 2);
      if (a < 7.07106781186547) {
        let n = 3.52624965998911e-2 * a + 0.700383064443688;
        n = n * a + 6.37396220353165; n = n * a + 33.912866078383; n = n * a + 112.079291497871;
        n = n * a + 221.213596169931; n = n * a + 220.206867912376;
        let d = 8.83883476483184e-2 * a + 1.75566716318264;
        d = d * a + 16.064177579207; d = d * a + 86.7807322029461; d = d * a + 296.564248779674;
        d = d * a + 637.333633378831; d = d * a + 793.826512519948; d = d * a + 440.413735824752;
        c = e * n / d;
      } else {
        let b = a + 0.65; b = a + 4 / b; b = a + 3 / b; b = a + 2 / b; b = a + 1 / b;
        c = e / b / 2.506628274631;
      }
    }
    return x > 0 ? 1 - c : c;
  }
  const phi = z => INV_SQRT_2PI * Math.exp(-0.5 * z * z);   // standard normal density

  // Quadrature grid for S = sqrt(V/nu): Simpson weights times the density, normalized to sum to 1.
  const gridCache = new Map();
  function chiGrid(nu) {
    if (!isFinite(nu)) return { s: new Float64Array([1]), w: new Float64Array([1]) };
    let g = gridCache.get(nu);
    if (g) return g;
    if (gridCache.size > 400) gridCache.clear();
    // Small df means a skewed, wide chi distribution (and large critical values), so it gets a finer grid.
    const N = nu < 40 ? 2000 : 800;
    const sd = 1 / Math.sqrt(2 * nu);
    const lo = Math.max(0, 1 - 12 * sd), hi = 1 + 14 * sd;
    const h = (hi - lo) / N;
    const s = new Float64Array(N + 1), w = new Float64Array(N + 1), lf = new Float64Array(N + 1);
    let maxL = -Infinity;
    for (let i = 0; i <= N; i++) {
      const si = lo + i * h;
      s[i] = si;
      lf[i] = si > 0 ? (nu - 1) * Math.log(si) - nu * si * si / 2 : -Infinity;
      if (lf[i] > maxL) maxL = lf[i];
    }
    let total = 0;
    for (let i = 0; i <= N; i++) {
      const simpson = (i === 0 || i === N) ? 1 : (i % 2 ? 4 : 2);
      w[i] = simpson * Math.exp(lf[i] - maxL);
      total += w[i];
    }
    for (let i = 0; i <= N; i++) w[i] /= total;
    g = { s, w };
    gridCache.set(nu, g);
    return g;
  }

  // P(T > t) and density for noncentral t (delta = 0 gives the central t)
  function tUpper(t, nu, delta = 0) {
    const { s, w } = chiGrid(nu);
    let p = 0;
    for (let i = 0; i < s.length; i++) p += w[i] * Phi(delta - t * s[i]);
    return p;
  }
  function tLower(t, nu, delta = 0) {
    const { s, w } = chiGrid(nu);
    let p = 0;
    for (let i = 0; i < s.length; i++) p += w[i] * Phi(t * s[i] - delta);
    return p;
  }
  function tDensity(t, nu, delta = 0) {
    const { s, w } = chiGrid(nu);
    let f = 0;
    for (let i = 0; i < s.length; i++) f += w[i] * s[i] * phi(t * s[i] - delta);
    return f;
  }

  // Find x in [lo, hi] where an increasing function f crosses `target`.
  function bisect(f, target, lo, hi, iters = 80) {
    for (let i = 0; i < iters; i++) {
      const mid = 0.5 * (lo + hi);
      if (f(mid) < target) lo = mid; else hi = mid;
      if (hi - lo <= 1e-12 * Math.max(1, Math.abs(hi))) break;
    }
    return 0.5 * (lo + hi);
  }

  // Upper-tail critical value of the central t: P(T > c) = p.
  // Newton's method on log P(T > c), started from a Cornish-Fisher guess, with a bisection safeguard.
  const critCache = new Map();
  function tCritical(p, nu) {
    const key = p + '|' + nu;
    if (critCache.has(key)) return critCache.get(key);
    if (critCache.size > 4000) critCache.clear();
    const z = zCritical(p);
    const z2 = z * z;
    let c = z + (z2 * z + z) / (4 * nu) + (5 * z2 * z2 * z + 16 * z2 * z + 3 * z) / (96 * nu * nu);  // Cornish-Fisher start
    let lo = 0, hi = Infinity;
    for (let i = 0; i < 60; i++) {
      const up = tUpper(c, nu);
      if (up > p) lo = c; else hi = c;
      const step = (Math.log(up) - Math.log(p)) * up / tDensity(c, nu);
      let next = c + step;
      if (!(next > lo && next < hi)) next = isFinite(hi) ? 0.5 * (lo + hi) : 2 * c;
      if (Math.abs(next - c) <= 1e-13 * c) { c = next; break; }
      c = next;
    }
    critCache.set(key, c);
    return c;
  }
  const zCache = new Map();
  const zCritical = p => {
    if (!zCache.has(p)) { if (zCache.size > 200) zCache.clear(); zCache.set(p, bisect(x => -Phi(-x), -p, 0, 40)); }
    return zCache.get(p);
  };

  // Core: power of a two-sample t-test.
  // sides: 2 = two-sided; 1 = one-sided in the direction of the predicted difference.
  function analyze({ n1, n2, diff, sd, alpha, sides }) {
    const nu = n1 + n2 - 2;
    const se = sd * Math.sqrt(1 / n1 + 1 / n2);
    const delta = Math.abs(diff) / se;
    const crit = tCritical(sides === 2 ? alpha / 2 : alpha, nu);
    let power, upper, lower = 0;
    upper = tUpper(crit, nu, delta);
    if (sides === 2) lower = tLower(-crit, nu, delta);
    power = upper + lower;
    return { power, nu, se, ncp: delta, crit, cohenD: Math.abs(diff) / sd, upper, lower };
  }
  const power = p => analyze(p).power;

  // Smallest difference in means detectable with the requested power.
  function solveDiff({ n1, n2, sd, alpha, sides, target }) {
    const base = power({ n1, n2, diff: 0, sd, alpha, sides });
    if (target <= base) return { diff: 0, trivial: true, base };
    let hi = sd;
    while (power({ n1, n2, diff: hi, sd, alpha, sides }) < target) {
      hi *= 2;
      if (hi > sd * 1e8) return { diff: Infinity };
    }
    const diff = bisect(d => power({ n1, n2, diff: d, sd, alpha, sides }), target, 0, hi);
    return { diff };
  }

  const N_CAP = 10000000;
  // Smallest integer m >= 2 with pw(m) >= target (pw increasing in m), or null if not reached by N_CAP.
  function smallestInteger(pw, target) {
    if (pw(2) >= target) return 2;
    let lo = 2, hi = 4;
    while (pw(hi) < target) {
      lo = hi; hi *= 2;
      if (hi >= N_CAP) {
        if (pw(N_CAP) < target) return null;
        hi = N_CAP; break;
      }
    }
    while (hi - lo > 1) {                     // invariant: pw(lo) < target <= pw(hi)
      const mid = Math.floor((lo + hi) / 2);
      if (pw(mid) >= target) hi = mid; else lo = mid;
    }
    return hi;
  }

  // The best power possible when one group grows without limit and the other stays at `fixed`:
  // the standard error can never fall below sd / sqrt(fixed), and the t-test becomes a z-test.
  function ceilingPower({ fixed, diff, sd, alpha, sides }) {
    const d = Math.abs(diff) / (sd / Math.sqrt(fixed));
    const z = zCritical(sides === 2 ? alpha / 2 : alpha);
    return Phi(d - z) + (sides === 2 ? Phi(-z - d) : 0);
  }

  // Smallest integer sample size reaching the target power.
  // which: 'both' (equal groups), 'control' (treatment fixed), 'treatment' (control fixed)
  function solveN({ which, n1, n2, diff, sd, alpha, sides, target }) {
    const sizes = m => which === 'both' ? [m, m] : which === 'control' ? [m, n2] : [n1, m];
    const pw = m => { const [a, b] = sizes(m); return power({ n1: a, n2: b, diff, sd, alpha, sides }); };
    if (diff === 0) return { impossible: true, reason: 'zero', maxPower: alpha };
    let maxPower = 1;
    if (which !== 'both') {
      maxPower = ceilingPower({ fixed: which === 'control' ? n2 : n1, diff, sd, alpha, sides });
      if (maxPower <= target) return { impossible: true, reason: 'ceiling', maxPower };
    }
    const m = smallestInteger(pw, target);
    if (m === null) return { impossible: true, reason: 'cap', maxPower };
    const [a, b] = sizes(m);
    return { n1: a, n2: b, power: pw(m), maxPower };
  }

  // Upper quantile of the (noncentral) t: the x with P(T > x) = p
  function tQuantileUpper(p, nu, delta = 0) {
    let lo = delta - 1, hi = delta + 4;
    while (tUpper(lo, nu, delta) < p) lo -= 2 * (hi - lo);
    while (tUpper(hi, nu, delta) > p) hi += 2 * (hi - lo);
    return bisect(x => -tUpper(x, nu, delta), -p, lo, hi, 60);
  }

  return { Phi, tUpper, tLower, tDensity, tCritical, tQuantileUpper, zCritical, analyze, power,
           solveDiff, solveN, smallestInteger, ceilingPower, N_CAP };
})();
</script>
<script>
(() => {
  'use strict';
  const E = PowerEngine;
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const els = { n1: $('n1'), n2: $('n2'), mu: $('mu'), diff: $('diff'), sd: $('sd'), power: $('power'), alpha: $('alpha') };
  const fields = { n1: $('f-n1'), n2: $('f-n2'), mu: $('f-mu'), diff: $('f-diff'), sd: $('f-sd'), power: $('f-power'), alpha: $('f-alpha') };
  const state = { solve: 'power', grow: 'both', sides: 2 };   // sides: 2 = two-sided (default); 1 only via ?sides=1
  let last = null;      // latest calculation

  /* ---------- formatting ---------- */
  const minus = str => str.replace(/^-/, '−');
  const fmtInt = n => Math.round(n).toLocaleString('en-US');
  const fmtSig = (x, sig = 3) => {
    if (!isFinite(x)) return '∞';
    if (x === 0) return '0';
    if (Math.abs(x) >= 1e6) return minus(Number(x.toPrecision(sig)).toLocaleString('en-US'));
    return minus(x.toLocaleString('en-US', { maximumSignificantDigits: sig }));
  };
  const fmtPct = p => {
    if (p >= 0.9995) return '>99.9%';            // anything that would round to 100.0%
    if (p < 0.001) return '<0.1%';
    return (p * 100).toFixed(1) + '%';
  };
  const fmtTarget = p => `${Number((p * 100).toFixed(1))}%`;   // what the user typed: "80%", not "80.0%"
  const aOrAn = str => {                                        // "a 33.8% chance" / "an 80.1% chance"
    const whole = str.replace(/^[<>]/, '').split(/[.%]/)[0];
    return /^8/.test(whole) || whole === '11' || whole === '18' ? 'an' : 'a';
  };
  const roundUpSig = (x, sig = 4) => {                          // round UP, so the shown value still meets the target
    if (!(x > 0) || !isFinite(x)) return x;

    return Number((Math.ceil(x / p - 1e-9) * p).toPrecision(sig));

  const people = n => `${fmtInt(n)} ${n === 1 ? 'person' : 'people'}`;
  // measurement values get a precision matched to the spread (SD 10 -> 1 decimal, SD 0.5 -> 3)
  const valueDecimals = sd => Math.max(0, Math.min(4, 2 - Math.floor(Math.log10(sd))));
  const fmtVal = (x, sd) => minus(x.toLocaleString('en-US', { minimumFractionDigits: valueDecimals(sd), maximumFractionDigits: valueDecimals(sd) }));

  /* ---------- inputs ---------- */
  function solvedKeys() {
    if (state.solve === 'power') return ['power'];
    if (state.solve === 'diff') return ['diff'];
    return state.grow === 'both' ? ['n1', 'n2'] : state.grow === 'control' ? ['n1'] : ['n2'];
  }
  // A solved field shows a rounded value; reading it back returns the exact one, so switching modes round-trips.
  const num = k => {
    const e = els[k], s = String(e.value).trim();
    if (s !== '' && e.dataset.shown === s) return Number(e.dataset.exact);
    return s === '' ? NaN : Number(s);
  };
  function setComputed(k, exact, shown) {
    els[k].value = shown; els[k].dataset.exact = String(exact); els[k].dataset.shown = String(shown); els[k].placeholder = '';
  }

  function readInputs() {
    const solved = solvedKeys(), errs = {}, v = {};
    const given = k => !solved.includes(k);
    v.n1 = num('n1'); v.n2 = num('n2'); v.mu = num('mu'); v.diff = num('diff'); v.sd = num('sd');
    v.target = num('power') / 100; v.alpha = num('alpha'); v.sides = state.sides;
    for (const k of ['n1', 'n2']) {
      if (!given(k)) continue;
      if (!(Number.isInteger(v[k]) && v[k] >= 2)) errs[k] = 'Enter a whole number, 2 or more.';
      else if (v[k] > E.N_CAP) errs[k] = 'At most 10,000,000.';
    }
    if (!isFinite(v.mu)) errs.mu = 'Enter a number.';
    if (given('diff') && !isFinite(v.diff)) errs.diff = 'Enter a number.';
    if (!(isFinite(v.sd) && v.sd > 0)) errs.sd = 'Must be greater than 0.';
    if (given('power') && !(v.target > 0 && v.target < 1)) errs.power = 'Enter a percentage between 0 and 100.';
    if (!(v.alpha > 0 && v.alpha <= 0.5)) errs.alpha = 'Between 0 and 0.5.';
    return { v, errs };
  }
  function showErrors(errs) {
    for (const k of Object.keys(fields)) {
      fields[k].classList.toggle('has-error', !!errs[k]);
      $('e-' + k).textContent = errs[k] || '';
    }
  }
  function applySolveUI() {
    const solved = solvedKeys();
    for (const k of ['n1', 'n2', 'diff', 'power']) {
      const on = solved.includes(k);
      fields[k].classList.toggle('is-solved', on);
      els[k].readOnly = on;
      els[k].tabIndex = on ? -1 : 0;
      els[k].setAttribute('aria-readonly', String(on));
    }
    $('growBox').hidden = state.solve !== 'n';
    $('powerLabelText').textContent = state.solve === 'power' ? 'Power' : 'Power you need';
    document.querySelectorAll('#solveSeg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.solve === state.solve)));
    document.querySelectorAll('#growSeg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.grow === state.grow)));
  }

  /* ---------- the calculation ---------- */
  function compute() {
    const { v, errs } = readInputs();
    showErrors(errs);
    if (Object.keys(errs).length) { renderInvalid(); return; }
    const common = { sd: v.sd, alpha: v.alpha, sides: v.sides };
    const res = { mode: state.solve, grow: state.grow, v, design: null, a: null, r: null };

    if (state.solve === 'power') {
      res.design = { n1: v.n1, n2: v.n2, diff: v.diff };
      res.a = E.analyze({ ...common, ...res.design });
      setComputed('power', res.a.power * 100, (res.a.power * 100).toFixed(1));
    } else if (state.solve === 'diff') {
      const r = E.solveDiff({ ...common, n1: v.n1, n2: v.n2, target: v.target });
      res.r = r;
      if (isFinite(r.diff)) {
        res.design = { n1: v.n1, n2: v.n2, diff: r.diff };
        res.a = E.analyze({ ...common, ...res.design });
        setComputed('diff', r.diff, String(roundUpSig(r.diff, 4)));
      } else els.diff.value = '';
    } else {
      const r = E.solveN({ ...common, which: state.grow, n1: v.n1, n2: v.n2, diff: v.diff, target: v.target });
      res.r = r;
      if (r.impossible) {
        for (const k of solvedKeys()) { els[k].value = ''; els[k].placeholder = '—'; }
      } else {
        els.n1.value = r.n1; els.n2.value = r.n2; els.n1.placeholder = els.n2.placeholder = '';
        res.design = { n1: r.n1, n2: r.n2, diff: v.diff };
        res.a = E.analyze({ ...common, ...res.design });
      }
    }
    last = res;
    if (sample && sample.key !== designKey()) sample = null;
    syncSampleButton();
    renderAnswer(res);
    updateCharts();
    writeURL();
  }

  function renderInvalid() {
    last = null;
    $('answerKicker').textContent = 'Waiting for valid inputs';
    $('answerValue').innerHTML = '&ndash;';
    $('answerText').textContent = 'Fix the highlighted field and the results will update.';
    $('answerNote').textContent = '';
    sample = null;
    syncSampleButton();
    updateCharts();
  }

  /* ---------- the written answer (kept plain on purpose) ---------- */
  function renderAnswer(res) {
    const { v, a, r, design } = res;
    const d = Math.abs(v.diff);
    let kicker = '', value = '', text = '', note = '';

    if (res.mode === 'n') {
      kicker = 'Sample size needed';
      if (r.impossible) {
        value = 'Not reachable';
        if (r.reason === 'zero') {
          text = 'A true difference of zero can&rsquo;t be detected, no matter how many people take part.';
        } else if (r.reason === 'ceiling') {
          const fixedName = res.grow === 'control' ? 'treatment' : 'control';
          const growName = res.grow === 'control' ? 'control' : 'treatment';
          const fixedN = res.grow === 'control' ? v.n2 : v.n1;
          text = `Even with an unlimited ${growName} group, power can&rsquo;t get past <b>${fmtPct(r.maxPower)}</b>, short of your ${fmtTarget(v.target)} target. With only ${people(fixedN)}, the ${fixedName} group&rsquo;s average stays too uncertain.`;
          note = `Make the ${fixedName} group bigger, or let both groups grow.`;
        } else {
          text = `Detecting a difference of ${fmtSig(v.diff)} with ${fmtTarget(v.target)} power would take more than 10,000,000 people per group.`;
        }
      } else if (res.grow === 'both') {
        value = `${fmtInt(design.n1)}<small>per group</small>`;
        text = `To have ${aOrAn(fmtTarget(v.target))} ${fmtTarget(v.target)} chance of detecting a true difference of ${fmtSig(v.diff)}, you need <b>${people(design.n1)} in each group</b>, ${fmtInt(design.n1 + design.n2)} in total.`;
      } else {
        const growN = res.grow === 'control' ? design.n1 : design.n2;
        const otherN = res.grow === 'control' ? design.n2 : design.n1;
        const growName = res.grow === 'control' ? 'control' : 'treatment';
        const otherName = res.grow === 'control' ? 'treatment' : 'control';
        value = `${fmtInt(growN)}<small>in the ${growName} group</small>`;
        text = `With ${people(otherN)} in the ${otherName} group, you need <b>${people(growN)} in the ${growName} group</b> (${fmtInt(growN + otherN)} in total) for ${aOrAn(fmtTarget(v.target))} ${fmtTarget(v.target)} chance of detecting a true difference of ${fmtSig(v.diff)}.`;
      }
    } else if (res.mode === 'diff') {
      kicker = 'Smallest difference you can detect';
      if (r.trivial) {
        value = '0';
        text = 'A target this low is met even when there is no real difference at all. Raise the power you need.';
      } else if (!isFinite(r.diff)) {
        value = 'Not reachable';
        text = 'No difference is large enough to reach that power with these settings.';
      } else {
        const dd = roundUpSig(r.diff, 4);
        value = fmtSig(dd, 4);
        const groups = v.n1 === v.n2 ? `${people(v.n1)} in each group` : `${fmtInt(v.n1)} in the control group and ${fmtInt(v.n2)} in the treatment group`;
        text = `With ${groups}, the smallest true difference you can detect with ${fmtTarget(v.target)} power is <b>${fmtSig(dd, 4)}</b>. Smaller real differences could easily go unnoticed.`;
      }
    } else {
      kicker = 'Power';
      value = fmtPct(a.power);
      const groups = v.n1 === v.n2 ? `${people(v.n1)} per group` : `${fmtInt(v.n1)} in the control group and ${fmtInt(v.n2)} in the treatment group`;
      text = d === 0
        ? 'With no real difference, there is nothing to detect.'
        : `If the true difference is ${fmtSig(v.diff)}, a study with ${groups} has ${aOrAn(fmtPct(a.power))} <b>${fmtPct(a.power)} chance</b> of detecting it.`;
    }
    $('answerKicker').textContent = kicker;
    $('answerValue').innerHTML = value;
    $('answerText').innerHTML = text;
    $('answerNote').innerHTML = note;
  }

  /* ---------- SVG helpers ---------- */
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(parent, x, y, str, attrs = {}) { const t = el('text', { x, y, ...attrs }, parent); t.textContent = str; return t; }
  function niceTicks(lo, hi, count) {
    const span = hi - lo; if (!(span > 0)) return [lo];
    let step = Math.pow(10, Math.floor(Math.log10(span / count)));
    const err = count / span * step;
    if (err <= 0.15) step *= 10; else if (err <= 0.35) step *= 5; else if (err <= 0.75) step *= 2;
    const ticks = [];
    for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) ticks.push(Number(t.toPrecision(12)));
    return ticks;
  }
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  /* ---------- three panels on one horizontal axis ----------
     1 Individuals: where individual values fall (normal, mean = group average, spread = SD). Ignores group sizes.
     2 Sample averages: where each group's average falls (same centers, spread = SD / sqrt(group size)).
     3 One sample: the people actually drawn, one lane per group, with each group's average.
     All panels share the x mapping. Panels 1 and 2 are each scaled to their own tallest curve. */
  const chart = { svg: null, W: 0, layer: null, cross: null, ring: null, tip: null, btn: null, geo: null,
                  map: null, hoverPx: null, hoverPy: null, dots: [] };
  let shown = null, anim = 0;
  let sample = null, sampling = false;
  const DOT_MAX = 1000;     // up to this many per group, people are drawn as dots; beyond that, as a histogram

  function targetParams() {
    if (!last) return null;
    const v = last.v;
    const diff = last.design ? last.design.diff : (last.mode === 'diff' ? NaN : v.diff);
    if (!isFinite(diff)) return null;
    const pad = 4 * v.sd;
    return {
      mu: v.mu, diff, sd: v.sd,
      lo: Math.min(v.mu, v.mu + diff) - pad, hi: Math.max(v.mu, v.mu + diff) + pad,
      se1: last.design ? v.sd / Math.sqrt(last.design.n1) : null,
      se2: last.design ? v.sd / Math.sqrt(last.design.n2) : null,
    };
  }
  const sameParams = (a, b) => !!a && !!b && ['mu', 'diff', 'sd', 'lo', 'hi', 'se1', 'se2'].every(k => a[k] === b[k]);
  function mix(a, b, t) {
    const lin = (x, y) => x + (y - x) * t;
    const geo = (x, y) => (x && y) ? Math.exp(Math.log(x) + (Math.log(y) - Math.log(x)) * t) : y;   // spreads ease on a log scale
    return { mu: lin(a.mu, b.mu), diff: lin(a.diff, b.diff), sd: geo(a.sd, b.sd), lo: lin(a.lo, b.lo), hi: lin(a.hi, b.hi),
             se1: geo(a.se1, b.se1), se2: geo(a.se2, b.se2) };
  }
  function updateCharts() {
    const target = targetParams();
    cancelAnimationFrame(anim);
    const still = !shown || !target || sameParams(shown, target) ||
                  window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { shown = target; render(shown); return; }
    // When the axis has to move, the curves change on the old axis first and the view zooms afterwards,
    // so a wider spread or a shifted average is seen happening rather than hidden by the rescaling.
    const axisMoves = shown.lo !== target.lo || shown.hi !== target.hi;
    const legs = axisMoves ? [[shown, { ...target, lo: shown.lo, hi: shown.hi }], [null, target]] : [[shown, target]];
    const dur = 380;
    const run = i => {
      const from = legs[i][0] || shown, to = legs[i][1], t0 = performance.now();
      const step = now => {
        const t = Math.min(1, (now - t0) / dur);
        shown = t < 1 ? mix(from, to, 1 - Math.pow(1 - t, 3)) : to;
        render(shown);
        if (t < 1) anim = requestAnimationFrame(step);
        else if (i + 1 < legs.length) anim = requestAnimationFrame(() => run(i + 1));
      };
      anim = requestAnimationFrame(step);
    };
    run(0);
  }

  // The fixed frame: sized to the container, rebuilt only when the width changes.
  function frame() {
    const box = $('chart');
    const W = Math.max(280, Math.round(box.clientWidth));
    if (chart.svg && chart.W === W) return;
    box.innerHTML = '';
    const narrow = W < 560, ph = narrow ? 120 : 150, sh = narrow ? 156 : 180;
    const l = 14, r = 14, pw = W - l - r;
    const p1 = { top: 30, h: ph };
    const p2 = { top: p1.top + ph + 64, h: ph };
    const p3 = { top: p2.top + ph + (narrow ? 96 : 76), h: sh };   // on phones the difference gets its own line under the title
    const laneH = (sh - 16 - 6) / 2;
    p3.lanes = [{ top: p3.top + 8, h: laneH }, { top: p3.top + 8 + laneH + 6, h: laneH }];
    const H = p3.top + sh + 50;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img' }, box);
    const layer = el('g', {}, svg);
    const cross = el('line', { y1: p1.top, y2: p3.top + sh, 'stroke-width': 1, opacity: 0 }, svg);
    const ring = el('circle', { r: 0, fill: 'none', 'stroke-width': 2, opacity: 0 }, svg);
    const hit = el('rect', { x: l, y: p1.top, width: pw, height: p3.top + sh - p1.top, fill: 'transparent', style: 'cursor: crosshair' }, svg);
    const tip = document.createElement('div'); tip.className = 'tip'; box.appendChild(tip);
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sample-btn'; btn.textContent = 'Sample';
    btn.style.top = (p3.top - (narrow ? 46 : 42)) + 'px'; btn.style.right = r + 'px';
    btn.addEventListener('click', runSample);
    box.appendChild(btn);
    Object.assign(chart, { svg, W, layer, cross, ring, tip, btn, geo: { W, H, l, pw, narrow, panels: [p1, p2, p3] } });
    const move = e => {
      const b = svg.getBoundingClientRect();
      chart.hoverPx = Math.min(l + pw, Math.max(l, (e.clientX - b.left) * W / b.width));
      chart.hoverPy = (e.clientY - b.top) * H / b.height;
      showHover();
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { chart.hoverPx = chart.hoverPy = null; showHover(); });
    syncSampleButton();
  }

  // Hover: on a person in the sample, their value; anywhere else, a crosshair through all panels with the value under it.
  function showHover() {
    const { cross, ring, tip, hoverPx: px, hoverPy: py, map } = chart;
    const place = (x, y) => {
      tip.classList.add('on');
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(chart.W - tw, Math.max(0, x - tw / 2)) + 'px';
      tip.style.top = (y - tip.offsetHeight - 6) + 'px';
    };
    if (px === null || !map) { tip.classList.remove('on'); cross.setAttribute('opacity', 0); ring.setAttribute('opacity', 0); return; }
    let best = null, bestD = Infinity;
    for (const d of chart.dots) {
      const dist = Math.hypot(d.x - px, d.y - py);
      if (dist < bestD) { bestD = dist; best = d; }
    }
    if (best && bestD <= Math.max(best.r + 3, 7)) {
      cross.setAttribute('opacity', 0);
      ring.setAttribute('cx', best.x); ring.setAttribute('cy', best.y); ring.setAttribute('r', best.r + 2.5);
      ring.setAttribute('stroke', css('--ink')); ring.setAttribute('opacity', 1);
      tip.textContent = fmtVal(best.v, map.sd);
      place(best.x, best.y - best.r - 2);
      return;
    }
    ring.setAttribute('opacity', 0);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('stroke', css('--ink-2')); cross.setAttribute('opacity', 0.55);
    tip.textContent = fmtVal(map.inv(px), map.sd);
    place(px, chart.geo.panels[0].top + 2);
  }

  function render(p) {
    frame();
    const { l, pw, narrow, panels } = chart.geo;
    const g = chart.layer;
    g.innerHTML = '';
    chart.dots = [];
    const col = { c: css('--control'), t: css('--treatment'), ci: css('--control-ink'), ti: css('--treatment-ink'),
                  bg: css('--plot-bg'), rule: css('--rule'), axis: css('--ink-2'), muted: css('--muted') };
    const titles = ['Individuals', 'Sample averages', 'One sample'];

    // panel frames, titles and the shared axis under each panel
    const X = p ? (x => l + (x - p.lo) / (p.hi - p.lo) * pw) : null;
    const ticks = p ? niceTicks(p.lo, p.hi, narrow ? 5 : 8) : [];
    panels.forEach((P, i) => {
      el('rect', { x: l, y: P.top, width: pw, height: P.h, rx: 8, fill: col.bg }, g);
      text(g, l, P.top - (i === 2 && narrow ? 30 : 10), titles[i], { class: 'panel-title' });
      const base = P.top + P.h;
      el('line', { x1: l, x2: l + pw, y1: base, y2: base, stroke: col.axis, 'stroke-width': 1 }, g);
      const ax = el('g', { class: 'axis' }, g);
      for (const t of ticks) {
        el('line', { x1: X(t), x2: X(t), y1: base, y2: base + 5, stroke: col.muted }, ax);
        text(ax, X(t), base + 19, fmtSig(t, 6), { 'text-anchor': 'middle' });
      }
    });
    const P3 = panels[2];
    el('line', { x1: l + 8, x2: l + pw - 8, y1: P3.lanes[1].top - 3, y2: P3.lanes[1].top - 3, stroke: col.rule, 'stroke-width': 1 }, g);
    P3.lanes.forEach((L, i) => text(g, l + 10, L.top + 14, i ? 'Treatment' : 'Control', { class: 'lane-label', fill: i ? col.ti : col.ci }));
    text(g, l + pw / 2, P3.top + P3.h + 42, 'Measured value', { 'text-anchor': 'middle', class: 'axis-title' });
    chart.map = p ? { inv: px => p.lo + (px - l) / pw * (p.hi - p.lo), sd: p.sd } : null;
    if (!p) { chart.svg.setAttribute('aria-label', 'No distributions to show for these settings'); showHover(); return; }

    // faint guides at the two true averages, through every panel
    const means = [p.mu, p.mu + p.diff];
    for (const m of means) {
      if (X(m) < l || X(m) > l + pw) continue;
      el('line', { x1: X(m), x2: X(m), y1: panels[0].top, y2: P3.top + P3.h, stroke: col.muted,
                   'stroke-width': 1, 'stroke-dasharray': '3 4', opacity: 0.55 }, g);
    }

    // one normal curve: filled, outlined, a spike when it is narrower than a pixel or two
    const curve = (P, c, s, hPx, color) => {
      const base = P.top + P.h;
      const zCut = Math.min(5, Math.sqrt(2 * Math.log(Math.max(1.01, hPx / 0.5))));
      const a = Math.max(p.lo, c - zCut * s), b = Math.min(p.hi, c + zCut * s);
      if (b <= a) return;
      if (X(b) - X(a) < 2) {
        if (c < p.lo || c > p.hi) return;
        el('line', { x1: X(c), x2: X(c), y1: base, y2: base - hPx, stroke: color, 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g);
        return;
      }
      let d = '';
      for (let i = 0; i <= 200; i++) {
        const x = a + (b - a) * i / 200;
        d += `${i ? 'L' : 'M'}${X(x).toFixed(2)},${(base - hPx * Math.exp(-0.5 * ((x - c) / s) ** 2)).toFixed(2)}`;
      }
      el('path', { d: `${d}L${X(b).toFixed(2)},${base}L${X(a).toFixed(2)},${base}Z`, fill: color, 'fill-opacity': 0.16, stroke: 'none' }, g);
      el('path', { d, fill: 'none', stroke: color, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g);
    };
    // labels above the peaks; when the peaks are close they point away from each other
    const labelPeaks = (P, h1, h2) => {
      const base = P.top + P.h;
      const x1 = X(means[0]), x2 = X(means[1]);
      const items = [[x1, base - h1 - 8, 'Control', col.ci], [x2, base - h2 - 8, 'Treatment', col.ti]];
      const close = Math.abs(x2 - x1) < (narrow ? 150 : 170);
      const ctrlLeft = x1 <= x2;
      items.forEach(([x, y, label, ink], i) => {
        const outward = !close ? 0 : ((i === 0) === ctrlLeft ? -1 : 1);
        const t = text(g, x + 4 * outward, y, label, { class: 'curve-label', fill: ink,
          'text-anchor': outward < 0 ? 'end' : outward > 0 ? 'start' : 'middle' });
        const bb = t.getBBox();
        if (bb.x < l + 4) t.setAttribute('x', Number(t.getAttribute('x')) + (l + 4 - bb.x));
        if (bb.x + bb.width > l + pw - 4) t.setAttribute('x', Number(t.getAttribute('x')) - (bb.x + bb.width - (l + pw - 4)));
      });
    };

    // panel 1: individuals (both curves the same height)
    const P1 = panels[0], top1 = P1.h * 0.8;
    curve(P1, means[0], p.sd, top1, col.c);
    curve(P1, means[1], p.sd, top1, col.t);
    labelPeaks(P1, top1, top1);

    // panel 2: sample averages (the narrower curve is the taller one)
    if (p.se1 && p.se2) {
      const P2 = panels[1], minSe = Math.min(p.se1, p.se2);
      const h1 = P2.h * 0.8 * minSe / p.se1, h2 = P2.h * 0.8 * minSe / p.se2;
      curve(P2, means[0], p.se1, h1, col.c);
      curve(P2, means[1], p.se2, h2, col.t);
      labelPeaks(P2, h1, h2);
    }

    // panel 3: the sample, if there is one
    drawSample(g, p, X, col);

    let label = `Three panels on one axis. Individuals: control centered at ${fmtVal(means[0], p.sd)}, treatment at ${fmtVal(means[1], p.sd)}, spread ${fmtVal(p.sd, p.sd)}.` +
      (p.se1 ? ` Sample averages: same centers, spread ${fmtVal(p.se1, p.sd)} (control) and ${fmtVal(p.se2, p.sd)} (treatment).` : '');
    if (sample) label += ` One sample: control average ${fmtVal(sample.means[0], p.sd)}, treatment average ${fmtVal(sample.means[1], p.sd)}.`;
    chart.svg.setAttribute('aria-label', label);
    showHover();
  }

  /* ---------- panel 3: one sample ---------- */
  const niceStep = (raw, up = true) => {
    const q = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / q;
    const steps = [1, 2, 2.5, 5, 10];
    const pick = up ? steps.find(s => s >= m - 1e-9) : [...steps].reverse().find(s => s <= m + 1e-9);
    return pick * q;
  };
  // histogram bins over the panel's range: Freedman-Diaconis width for normal data, 9 to 70 bins
  function binPlan(lo0, hi0, sd, n) {
    const span = hi0 - lo0;
    let w = niceStep(2.7 * sd * Math.pow(n, -1 / 3));
    if (span / w > 70) w = niceStep(span / 70);
    if (span / w < 9) w = niceStep(span / 9, false);
    const lo = Math.floor(lo0 / w) * w, hi = Math.ceil(hi0 / w) * w;
    return { lo, w, nb: Math.max(1, Math.round((hi - lo) / w)) };
  }
  // pile the people into columns one dot wide (a dot plot)
  function stack(vals, d, X) {
    const { l, pw } = chart.geo, cols = new Map(), dots = [];
    let max = 0;
    const sorted = Array.from(vals).sort((a, b) => a - b);
    for (const v of sorted) {
      const x = X(v);
      if (x < l || x > l + pw) continue;
      const c = Math.min(Math.floor(pw / d) - 1, Math.floor((x - l) / d));
      const k = cols.get(c) || 0;
      cols.set(c, k + 1); max = Math.max(max, k + 1);
      dots.push({ col: c, k, v });
    }
    return { dots, max };
  }
  function drawSample(g, p, X, col) {
    const s = sample;
    if (!s) return;
    const { l, pw } = chart.geo, P3 = chart.geo.panels[2], lanes = P3.lanes;
    const avail = lanes[0].h - 24;          // keep the top row of each lane clear for its labels
    const colors = [[col.c, col.ci], [col.t, col.ti]];

    // dots when they fit (largest dot size whose tallest pile fits the lane); otherwise a histogram
    let d = 0, piles = null;
    if (s.vals) {
      for (let dd = 10; dd >= 3; dd--) {
        const tryPiles = s.vals.map(v => stack(v, dd, X));
        if (Math.max(...tryPiles.map(t => t.max)) * dd <= avail) { d = dd; piles = tryPiles; break; }
      }
    }
    let hist = null;
    if (!d) {
      if (!s.hist) {                          // values kept but too many to show as dots at this width
        const plan = binPlan(p.lo, p.hi, s.sd, Math.max(s.n1, s.n2));
        s.hist = { ...plan, counts: s.vals.map(vals => {
          const c = new Uint32Array(plan.nb);
          for (const v of vals) { const b = Math.floor((v - plan.lo) / plan.w); if (b >= 0 && b < plan.nb) c[b]++; }
          return c;
        }) };
      }
      hist = s.hist;
    }
    const shares = hist ? hist.counts.map((c, i) => Array.from(c, k => k / (i ? s.n2 : s.n1))) : null;
    const topShare = shares ? Math.max(...shares[0], ...shares[1]) : 0;

    lanes.forEach((L, i) => {
      const base = L.top + L.h - 3;
      const [color, ink] = colors[i];
      if (d) {
        const r = Math.max(1.2, d / 2 - 0.6);
        const gd = el('g', { fill: color, 'fill-opacity': 0.8 }, g);
        for (const dot of piles[i].dots) {
          const cx = l + (dot.col + 0.5) * d, cy = base - (dot.k + 0.5) * d;
          el('circle', { cx: cx.toFixed(2), cy: cy.toFixed(2), r }, gd);
          chart.dots.push({ x: cx, y: cy, r, v: dot.v });
        }
      } else {
        const gb = el('g', { fill: color, 'fill-opacity': 0.5 }, g);
        const binPx = X(hist.lo + hist.w) - X(hist.lo), gap = binPx > 5 ? 1 : 0;
        shares[i].forEach((sh, b) => {
          if (!sh) return;
          const x0 = Math.max(l, X(hist.lo + b * hist.w) + gap / 2), x1 = Math.min(l + pw, X(hist.lo + (b + 1) * hist.w) - gap / 2);
          if (x1 <= x0) return;
          const h = sh / topShare * avail;
          el('rect', { x: x0.toFixed(2), y: (base - h).toFixed(2), width: (x1 - x0).toFixed(2), height: h.toFixed(2) }, gb);
        });
      }
      // this group's average: a thick line through the lane, labeled with its value
      const mx = X(s.means[i]);
      if (mx >= l && mx <= l + pw) {
        el('line', { x1: mx, x2: mx, y1: L.top + 2, y2: base + 1, stroke: color, 'stroke-width': 3 }, g);
        const t = text(g, mx + 8, L.top + 15, `Average ${fmtVal(s.means[i], s.sd)}`, { class: 'mean-label', fill: ink });
        const bb = t.getBBox();
        if (bb.x + bb.width > l + pw - 6) { t.setAttribute('x', mx - 8); t.setAttribute('text-anchor', 'end'); }
      }
    });
    const narrow = chart.geo.narrow;
    text(g, narrow ? l : l + pw - 118, P3.top - (narrow ? 10 : 12), `Difference ${fmtVal(s.means[1] - s.means[0], s.sd)}`,
         { 'text-anchor': narrow ? 'start' : 'end', class: 'diff-readout' });
  }

  let spare = null;
  function randn() {                       // Box-Muller, standard normal
    if (spare !== null) { const z = spare; spare = null; return z; }
    let u = 0; while (u === 0) u = Math.random();
    const r = Math.sqrt(-2 * Math.log(u)), t = 2 * Math.PI * Math.random();
    spare = r * Math.sin(t); return r * Math.cos(t);
  }
  const designKey = () => last && last.design ? [last.design.n1, last.design.n2, last.design.diff, last.v.sd, last.v.mu].join('|') : null;
  function syncSampleButton(progress) {
    const btn = chart.btn; if (!btn) return;
    btn.disabled = sampling || !designKey();
    btn.textContent = sampling ? (progress === undefined ? 'Sampling…' : `Sampling ${progress}%`) : 'Sample';
  }
  function runSample() {
    if (sampling || !designKey()) return;
    const { n1, n2, diff } = last.design, sd = last.v.sd, mu = last.v.mu;
    const keep = n1 <= DOT_MAX && n2 <= DOT_MAX;
    const s = { key: designKey(), n1, n2, diff, sd, mu, sums: [0, 0],
                vals: keep ? [new Float64Array(n1), new Float64Array(n2)] : null, hist: null };
    if (!keep) {
      const p = targetParams(), plan = binPlan(p.lo, p.hi, sd, Math.max(n1, n2));
      s.hist = { ...plan, counts: [new Uint32Array(plan.nb), new Uint32Array(plan.nb)] };
    }
    const jobs = [[n1, mu], [n2, mu + diff]], total = n1 + n2, CHUNK = 400000;
    let job = 0, inJob = 0, done = 0;
    sampling = true; syncSampleButton();
    const step = () => {
      let budget = CHUNK;
      while (budget > 0 && job < 2) {
        const [n, m] = jobs[job], k = Math.min(budget, n - inJob);
        let sum = 0;
        for (let i = 0; i < k; i++) {
          const x = m + sd * randn();
          sum += x;
          if (keep) s.vals[job][inJob + i] = x;
          else { const b = Math.floor((x - s.hist.lo) / s.hist.w); if (b >= 0 && b < s.hist.nb) s.hist.counts[job][b]++; }
        }
        s.sums[job] += sum; inJob += k; done += k; budget -= k;
        if (inJob >= n) { job++; inJob = 0; }
      }
      if (job < 2) { syncSampleButton(Math.floor(100 * done / total)); setTimeout(step, 0); return; }
      sampling = false;
      if (s.key === designKey()) { s.means = [s.sums[0] / n1, s.sums[1] / n2]; sample = s; }   // settings changed meanwhile: drop it
      syncSampleButton();
      render(shown);
    };
    step();
  }

  /* ---------- shareable links ---------- */
  function writeURL() {
    const p = new URLSearchParams({
      solve: state.solve, grow: state.grow, n1: els.n1.value, n2: els.n2.value, diff: els.diff.value,
      sd: els.sd.value, power: els.power.value, alpha: els.alpha.value, mu: els.mu.value
    });
    if (state.sides === 1) p.set('sides', '1');
    try { history.replaceState(null, '', '?' + p.toString()); } catch (e) { /* file:// or sandboxed */ }
  }
  function readURL() {
    const p = new URLSearchParams(location.search);
    if (['n', 'diff', 'power'].includes(p.get('solve'))) state.solve = p.get('solve');
    if (['both', 'control', 'treatment'].includes(p.get('grow'))) state.grow = p.get('grow');
    for (const k of ['n1', 'n2', 'mu', 'diff', 'sd', 'power', 'alpha']) if (p.has(k) && p.get(k) !== '') els[k].value = p.get(k);
    if (p.get('sides') === '1') state.sides = 1;
  }

  /* ---------- wiring ---------- */
  let timer = null;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(compute, 120); };
  for (const k of Object.keys(els)) els[k].addEventListener('input', schedule);
  document.querySelectorAll('#solveSeg button').forEach(b => b.addEventListener('click', () => {
    state.solve = b.dataset.solve; applySolveUI(); compute();
  }));
  document.querySelectorAll('#growSeg button').forEach(b => b.addEventListener('click', () => {
    state.grow = b.dataset.grow; applySolveUI(); compute();
  }));
  for (const id of ['solveSeg', 'growSeg']) {          // arrow keys move between options
    $(id).addEventListener('keydown', e => {
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
      const btns = [...$(id).querySelectorAll('button')];
      const i = btns.indexOf(document.activeElement); if (i < 0) return;
      const j = (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length;
      btns[j].focus(); btns[j].click(); e.preventDefault();
    });
  }
  $('copyLink').addEventListener('click', async () => {
    const btn = $('copyLink'), url = location.href;
    try { await navigator.clipboard.writeText(url); btn.textContent = 'Link copied'; }
    catch (e) { window.prompt('Copy this link:', url); }
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1800);
  });
  let lastW = 0;
  new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w !== lastW) { lastW = w; render(shown); }
  }).observe($('chart'));
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render(shown));

  readURL();
  applySolveUI();
  compute();
})();
</script>
</body>
</html>
